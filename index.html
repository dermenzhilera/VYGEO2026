
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testovací mapa</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        #map {
            height: 85vh;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h2>Moje testovací mapa</h2>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Vytvoření mapy – Olomouc
    const map = L.map('map').setView([49.5938, 17.2509], 13);

    // OpenStreetMap podklad
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Značka na mapě
    L.marker([49.5938, 17.2509])
        .addTo(map)
        .bindPopup('<b>Olomouc</b><br>Testovací značka')
        .openPopup();

    // Přidání značky kliknutím
    map.on('click', function(e) {
        L.marker(e.latlng)
            .addTo(map)
            .bindPopup('Nová značka!')
            .openPopup();
    });
</script>

</body>
</html>
